set-option -as terminal-overrides ",xterm*:Tc"
set -g mouse on

#set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Open new windows in the Home directory
bind c new-window -c "~"

# Shift Alt vim keys to switch windows
# bind -n Ò next-window
# bind -n Ó previous-window
bind -n M-H previous-window
bind -n M-L next-window



set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @tmux-gruvbox 'dark' # or 'light'
# set -g @plugin 'jimeh/tmux-themepack'
# set -g @plugin 'z3z1ma/tmux-gruvbox'
# set -g @plugin 'maxpetretta/tmux-monokai-pro'
set -g @plugin 'loctvl842/monokai-pro.tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you ever 15 mins 

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
#set -g @themepack 'powerline/block/gray'
# set -g @gruvbox_flavour 'dark'

#set vi-mode
set-window-option -g mode-keys vi

# set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",xterm-256color:Tc"
# set -ga terminal-overrides ",*-256color:Tc"

#keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

#Open panes in current directory
# bind '"' split-window -v -c "#{pane_current_path}"
# bind % split-window -h -c "#{pane_current_path}"

bind C-l send-keys 'C-l'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# The "Smart" Shift+Enter
# 1. Check if any child process in this pane is node, opencode, npm, or claude
# 2. If YES: Send Alt+Enter (M-Enter) to force a newline
# 3. If NO: Send regular Shift+Enter (S-Enter)
bind -n S-Enter if-shell 'ps -o comm= -t #{pane_tty} | grep -qE "^(node|opencode|npm|claude)$"' 'send-keys M-Enter' 'send-keys S-Enter'

# Open a floating Neovim window (Scratchpad)
# 1. Opens nvim in a popup
# 2. When you quit (:wq), it loads the text into the paste buffer
# 3. It automatically pastes the text into the underlying program
bind -n M-v display-popup -E -w 80% -h 80% \
  "nvim /tmp/tmux-scratchpad && tmux load-buffer /tmp/tmux-scratchpad && tmux paste-buffer"
